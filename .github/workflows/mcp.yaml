name: MCP server

# The path filter must cover every tree the freshness gate reads, not just mcp/.
# check_freshness.py re-derives scripts.json from sql/**/*.sql and powershell/**/*.ps1, and
# docs.json/prompts.json from docs/** and powershell/**/*.md. With the filter set to mcp/**
# alone, editing a script never ran the gate that exists to catch exactly that drift: the
# datasets and their sources disagreed and CI stayed green. That is how the datasets went
# stale twice, and how a branch stranded carrying the fix.
on:
  push:
    branches: [ main ]
    paths: [ 'mcp/**', 'sql/**', 'powershell/**', 'docs/**', '.github/workflows/mcp.yaml' ]
  pull_request:
    branches: [ main ]
    paths: [ 'mcp/**', 'sql/**', 'powershell/**', 'docs/**', '.github/workflows/mcp.yaml' ]

# Default: no permissions. Each job declares only what it needs.
permissions: {}

jobs:
  test:
    name: Test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: [ '3.10', '3.13' ]
    defaults:
      run:
        working-directory: mcp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e .

      - name: Self-test (datasets load from the installed package)
        run: sqldba-mcp --selftest || python -m sqldba_mcp --selftest

      - name: Tests
        run: python -m unittest discover -s tests -v

      - name: Retrieval eval (regression gate + published score)
        run: python tests/eval_faq.py

      # The suite that asks from OUTSIDE the corpus. `unittest discover` matches test*.py,
      # so real_questions.py was silently excluded from the step above - which would have
      # been a quiet joke, given it exists precisely because the other suites cannot fail
      # for a record that is missing, mislabelled or wrong. It gates two things: the real
      # questions people have asked, and the off-domain refusal rate.
      - name: Real questions (asked from outside the corpus) + off-domain honesty
        run: python -m unittest tests.real_questions -v

      # Freshness contract. The datasets are GENERATED - if someone hand-edits one, or a
      # source changes without a re-export, the committed data and its source disagree and
      # the server starts citing a post that no longer says what it claims. That must break
      # the build, not surface as a quiet wrong answer months later.
      - name: Freshness - datasets must not have drifted from their sources
        run: python tests/check_freshness.py

      - name: Build a wheel and confirm the datasets are inside it
        run: |
          pip install build
          python -m build --wheel --outdir dist
          python - <<'PY'
          import glob, zipfile, sys
          whl = glob.glob('dist/*.whl')[0]
          names = zipfile.ZipFile(whl).namelist()
          need = ['errors.json', 'waits.json', 'builds.json', '_meta.json']
          missing = [n for n in need if not any(x.endswith('datasets/' + n) for x in names)]
          if missing:
              sys.exit('Wheel is missing bundled datasets: %s' % missing)
          print('wheel OK:', whl, '-', len(names), 'files')
          PY
